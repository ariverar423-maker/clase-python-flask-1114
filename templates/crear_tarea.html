<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tarea - Portal Clase 1114</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        

        .navbar {
            background-color: #667eea !important; 
        }


        .paginatareas-container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }


        .paginatareas-title {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }


        .paginatareas-btn-submit {
            background-color: #667eea;
            color: white;
            border: none;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .paginatareas-btn-submit:hover {
            background-color: #5266d4;
            color: white;
        }


        .paginatareas-btn-cancel {
            background-color: #e2e8f0;
            color: #4a5568;
            border: none;
            font-weight: 500;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: background-color 0.2s;
        }

        .paginatareas-btn-cancel:hover {
            background-color: #cbd5e1;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Clase 1114</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/informacion">Informacion</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recursos">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="/tareas">Tareas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inscripcion">Inscripcion</a></li>
                    <li class="nav-item"><a class="nav-link" href="/estudiantes">Estudiantes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="paginatareas-container">
            <h1 class="paginatareas-title">Crear Nueva Tarea</h1>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Titulo</label>
                    <input type="text" class="form-control" name="titulo" placeholder="Escribe el titulo de la tarea" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descripcion</label>
                    <textarea class="form-control" name="descripcion" rows="5" placeholder="Escribe las instrucciones detalladas" required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Fecha de Entrega</label>
                    <input type="date" class="form-control" name="fecha_entrega" required>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="paginatareas-btn-submit flex-grow-1">Crear Tarea</button>
                    <a href="/mis-tareas" class="paginatareas-btn-cancel flex-grow-1">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
