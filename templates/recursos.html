<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos - Portal Clase 1114</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        

        .navbar {
            background-color:  #667eea !important; 
        }


        .paginarecursos-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

     
        .paginarecursos-title {
            color:  #667eea;
            font-weight: 700;
            margin-bottom: 25px;
            border-bottom: 3px solid  #667eea;
            padding-bottom: 10px;
        }

        .paginarecursos-list {
            list-style: none;
            padding: 0;
        }

        .paginarecursos-item {
            background-color: #f1f0fa;
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .paginarecursos-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(90, 75, 188, 0.15);
        }


        .paginarecursos-link {
            color: #4a3ba8;
            font-weight: 600;
            text-decoration: none;
            font-size: 1.1rem;
        }

        .paginarecursos-link:hover {
            color:  #667eea;
            text-decoration: underline;
        }


        .paginarecursos-btn {
            background-color:  #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
        }

        .paginarecursos-btn:hover {
            background-color:  #667eea;
            color: white;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Clase 1114</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/informacion">Informacion</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="/recursos">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tareas">Tareas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inscripcion">Inscripcion</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="paginarecursos-container">
            <h1 class="paginarecursos-title">RECURSOS</h1> 

            <ul class="paginarecursos-list">
                {% for enlace in enlaces %}
                <li class="paginarecursos-item">
                    <a class="paginarecursos-link" href="{{ enlace.url }}" target="_blank">
                         {{ enlace.nombre }}
                    </a>
                    <a class="paginarecursos-btn" href="{{ enlace.url }}" target="_blank">Abrir</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
