<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Clase 1114</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        

        .navbar {
            background-color:  #667eea !important; 
        }


        .Paginalogin-container {
            max-width: 400px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }


        .Paginalogin-title {
            color:  #667eea;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }


        .Paginalogin-btn {
            background-color:  #667eea;
            color: white;
            width: 100%;
            font-weight: 500;
            border: none;
        }

        .Paginalogin-btn:hover {
            background-color:  #667eea;
            color: white;
        }

        .Paginalogin-alert {
            background-color: #f8d7da;
            color: #842029;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Clase 1114</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/informacion">Información</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recursos">Recursos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tareas">Tareas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/inscripcion">Inscripción</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="Paginalogin-container">
            <h2 class="Paginalogin-title">Login Portal 1114</h2>
            
            {% if mensaje %}
                <div class="Paginalogin-alert">
                    {{ mensaje }}
                </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario:</label>
                    <input type="text" class="form-control" name="usuario" placeholder="Ingresa tu usuario" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña:</label>
                    <input type="password" class="form-control" name="contraseña" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn Paginalogin-btn py-2">Iniciar Sesión</button>
            </form>

            <hr class="my-4">
            
            <div class="text-muted small text-center">
                <p class="mb-1"><strong>Datos de prueba:</strong></p>
                <p class="mb-0">Profesor: <span class="badge bg-secondary">henry</span> / Contraseña: <span class="badge bg-secondary">password123</span></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
